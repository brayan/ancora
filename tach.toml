# ADR 0017: exact capability boundaries; external domain imports are checked separately.
source_roots = ["apps/api/src"]
exact = true
root_module = "forbid"
forbid_circular_dependencies = true
ignore_type_checking_imports = false

[[modules]]
path = "ancora"
depends_on = []

[[modules]]
path = "ancora.config"
depends_on = []

[[modules]]
path = "ancora.shared.application"
depends_on = []

[[modules]]
path = "ancora.challenges.domain"
depends_on = []

[[modules]]
path = "ancora.challenges.application"
depends_on = ["ancora.challenges.domain"]

[[modules]]
path = "ancora.challenges.application.interfaces"
depends_on = ["ancora.challenges.application"]

[[modules]]
path = "ancora.challenges.application.services"
depends_on = ["ancora.challenges.application", "ancora.challenges.application.interfaces", "ancora.challenges.domain"]

[[modules]]
path = "ancora.challenges.infrastructure"
depends_on = ["ancora.challenges.application", "ancora.challenges.domain", "ancora.shared.application"]

[[modules]]
path = "ancora.hints.domain"
depends_on = ["ancora.challenges.domain"]

[[modules]]
path = "ancora.hints.application"
depends_on = ["ancora.hints.domain"]

[[modules]]
path = "ancora.hints.application.interfaces"
depends_on = ["ancora.hints.application"]

[[modules]]
path = "ancora.hints.application.services"
depends_on = ["ancora.hints.application", "ancora.hints.application.interfaces", "ancora.hints.domain", "ancora.challenges.domain"]

[[modules]]
path = "ancora.hints.infrastructure"
depends_on = ["ancora.hints.application", "ancora.hints.domain", "ancora.shared.application"]

[[modules]]
path = "ancora.coaching.domain"
depends_on = ["ancora.challenges.domain"]

[[modules]]
path = "ancora.coaching.application"
depends_on = ["ancora.coaching.domain"]

[[modules]]
path = "ancora.coaching.application.interfaces"
depends_on = ["ancora.coaching.application"]

[[modules]]
path = "ancora.coaching.application.services"
depends_on = ["ancora.coaching.application", "ancora.coaching.application.interfaces", "ancora.coaching.domain", "ancora.challenges.domain"]

[[modules]]
path = "ancora.coaching.infrastructure"
depends_on = ["ancora.coaching.application", "ancora.coaching.domain", "ancora.shared.application"]

[[modules]]
path = "ancora.api"
depends_on = ["ancora.config", "ancora.shared.application", "ancora.challenges.application", "ancora.challenges.application.interfaces", "ancora.challenges.application.services", "ancora.challenges.domain", "ancora.hints.application", "ancora.hints.application.interfaces", "ancora.hints.application.services", "ancora.hints.domain", "ancora.coaching.application", "ancora.coaching.application.interfaces", "ancora.coaching.application.services", "ancora.coaching.domain"]

[[modules]]
path = "ancora.bootstrap"
depends_on = ["ancora.api", "ancora.config", "ancora.challenges.application.interfaces", "ancora.challenges.application.services", "ancora.challenges.infrastructure", "ancora.hints.application.interfaces", "ancora.hints.application.services", "ancora.hints.infrastructure", "ancora.coaching.application.interfaces", "ancora.coaching.application.services", "ancora.coaching.infrastructure"]

[[modules]]
path = "ancora.main"
depends_on = []

[[interfaces]]
from = ["ancora.challenges.domain"]
expose = ["models(\\..*)?"]
visibility = ["ancora.hints.domain", "ancora.coaching.domain", "ancora.challenges.application", "ancora.challenges.application.services", "ancora.hints.application.services", "ancora.coaching.application.services", "ancora.api", "ancora.challenges.infrastructure"]

[[interfaces]]
from = ["ancora.challenges.domain"]
expose = ["errors(\\..*)?", "values(\\..*)?"]
visibility = ["ancora.challenges.application.services", "ancora.hints.application.services", "ancora.coaching.application.services", "ancora.api", "ancora.challenges.infrastructure"]

[[interfaces]]
from = ["ancora.challenges.domain"]
expose = ["rules(\\..*)?"]
visibility = ["ancora.challenges.application.services"]
