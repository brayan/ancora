# ADR 0020: exact capability boundaries; external domain imports are checked separately.
source_roots = ["backend/src"]
exact = true
root_module = "forbid"
forbid_circular_dependencies = true
ignore_type_checking_imports = false

[[modules]]
path = "ancora"
