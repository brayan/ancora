[project]
name = "ancora-python"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "sailtech-python-checks[architecture]==0.10.3",
    "tach==0.35.3",
]

[tool.uv]
package = false
required-version = "==0.11.18"

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
sailtech-python-checks = { path = "config/quality/python/sailtech_python_checks-0.10.3-py3-none-any.whl" }

[tool.pyright]
include = [
    "backend/src",
    "backend/tests",
    "web/runner/harness.py",
    "web/tests/python",
]
extraPaths = ["backend/src", "web/runner"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportPrivateUsage = "error"
reportImplicitStringConcatenation = "error"
reportMatchNotExhaustive = "error"
reportUnnecessaryTypeIgnoreComment = "error"
useLibraryCodeForTypes = true

[tool.ruff]
target-version = "py313"
include = ["backend/**/*.py", "web/runner/harness.py", "web/tests/python/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "ANN", "B", "I", "UP", "SIM",
    "N801", "N802", "N803", "N804", "N805", "N806", "N815", "N816",
    "ARG001", "ARG002", "ARG003",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "RUF100",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 8
max-statements = 50

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "web/tests/python"]
pythonpath = ["backend/src", "web/runner"]
addopts = "--strict-config --strict-markers -p no:tach"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
