version: 0.4
project: ancora
status: fixed-practice-persistence
description: Local single-user Python programming practice with generated challenges.
startup:
  root_guidance: AGENTS.md
  domain_context: CONTEXT.md
  manifest: docs/agents/repo-manifest.yaml
  project_shards_dir: docs/agents/projects
  rule: Read current guidance, ADR 0011 and only the shard for the touched boundary.
canonical_docs:
  business_problem: docs/product/business-problem.md
  programming_practice: docs/product/programming-practice.md
  system_overview: docs/architecture/system-overview.md
  practice_persistence: docs/architecture/practice-persistence.md
  runner_spike: docs/architecture/runner-spike.md
  architecture_decisions: docs/adr
  documentation_governance: docs/engineering/documentation-governance.md
  git_conventions: docs/engineering/git-conventions.md
  code_quality: docs/engineering/code-quality-conventions.md
  monorepo_conventions: docs/engineering/monorepo-conventions.md
  nextjs_feature_first_convention: docs/frontend/nextjs-feature-first-convention.md
  nextjs_naming_convention: docs/frontend/nextjs-naming-convention.md
  test_impact_policy: docs/testing/change-based-test-coverage-policy.md
  testing_strategy: docs/testing/testing-strategy.md
  eval_strategy: docs/evals/eval-strategy.md
  implementation_plan: docs/exec-plans/programming-practice.md
accepted_stack:
  web: Next.js App Router, React and TypeScript
  product: apps/web owns product orchestration and durable records
  generation: Planned FastAPI/Pydantic AI service in apps/practice-service; no DB writes
  persistence: PostgreSQL and Drizzle; additive 0006 with ledger preflight
  provider: OpenAI; model and live-eval budget not yet selected
  identity: Local single-user; no login or accounts
  runner: Disposable Pyodide worker on separate loopback static origin
privacy_boundary: Submitted code and private material must not leak to logs, traces, screenshots, fixtures or eval artifacts.
deferred:
  - public hosting and multi-user access
  - auth, sources, decks/cards, RAG and embeddings
  - uploaded files, queues, Redis, Kubernetes and Terraform
command_surface:
  available:
    - pnpm db:migrate
    - pnpm contracts:check
    - pnpm contracts:generate
    - pnpm web:test:db
    - pnpm dev
    - pnpm code:check
    - pnpm format:check
    - pnpm format:write
    - pnpm quality:test
    - pnpm web:lint
    - pnpm web:typecheck
    - pnpm web:test
    - pnpm web:test:browser
    - pnpm eval:smoke
    - pnpm repo:test:fast
    - pnpm repo:test:context
    - pnpm repo:test:task
    - pnpm repo:test:pr
  paused: Schema diff generation and account seeding; custom migrations require ledger review
  rule: Inspect scripts; never report planned commands as available or run.
project_shards:
  - name: web
    file: docs/agents/projects/web.yaml
    routes: [apps/web/**, packages/ui/**, packages/shared-types/**, packages/schemas/**, prompts/**, docs/frontend/**]
  - name: practice-service
    file: docs/agents/projects/practice-service.yaml
    routes: [apps/practice-service/**]
  - name: eval-runner
    file: docs/agents/projects/eval-runner.yaml
    routes: [tools/eval-runner/**, evals/**]
  - name: scripts-ci
    file: docs/agents/projects/scripts-ci.yaml
    routes: [scripts/**, docker/**, infra/**, config/**, packages/config/**, docs/**, package.json, Makefile, pnpm-workspace.yaml]
adr_index:
  - docs/adr/0011-focus-on-local-programming-practice.md
  - docs/adr/0012-persist-fixed-practice-with-additive-migrations.md
historical_adrs: docs/adr/0001 through 0010 are retained; ADR 0011 defines current ownership.
