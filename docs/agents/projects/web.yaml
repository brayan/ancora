name: web
status: challenge-generation
primary_paths: [apps/web]
related_paths: [packages/ui, packages/shared-types, packages/schemas]
read_first:
  - docs/engineering/code-quality-conventions.md
  - CONTEXT.md
  - docs/adr/0011-focus-on-local-programming-practice.md
  - docs/frontend/nextjs-feature-first-convention.md
  - docs/frontend/nextjs-naming-convention.md
  - docs/architecture/runner-spike.md
  - docs/architecture/practice-persistence.md
  - docs/architecture/challenge-generation.md
  - docs/adr/0012-persist-fixed-practice-with-additive-migrations.md
role: Next.js UI/product boundary, durable generation/practice records and isolated browser execution delivery.
allowed_work:
  - Thin App Router routes and programming-practice UI
  - Bounded runner protocol, dedicated static origin and disposable workers
  - Durable generation lifecycle, bounded service client and approved additive persistence
out_of_scope:
  - Authentication, account, source and card feature restoration
  - Provider/database credentials or privileged bridges in browser execution
  - Host/server execution of generated Python
  - Destructive legacy schema transition or schema push without further review
validation:
  expected_commands: [pnpm contracts:check, pnpm web:test:db, pnpm code:check, pnpm quality:test, pnpm web:lint, pnpm web:typecheck, pnpm web:test, pnpm web:test:browser]
  fallback: Report missing commands and browser prerequisites honestly.
