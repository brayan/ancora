[project]
name = "ancora-practice-service"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.162.7",
  "pydantic==2.14.3",
  "pydantic-ai-slim[openai]==2.68.0",
  "openai==3.51.0",
  "httpx2==2.16.0",
  "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practice_service"]
